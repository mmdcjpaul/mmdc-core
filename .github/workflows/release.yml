name: MMDC development release publication

on:
  push:
    tags:
      - 'v*.*.*-dev.*'

permissions:
  contents: read

defaults:
  run:
    shell: bash

concurrency:
  group: mmdc-development-release-${{ github.ref }}
  cancel-in-progress: false

env:
  AWS_REGION: ap-southeast-1
  ECR_REPOSITORY: 349762920349.dkr.ecr.ap-southeast-1.amazonaws.com/mmdc-v3-development
  DEPLOYMENT_BUCKET: mmdc-v3-development-deployments-349762920349-ap-southeast-1
  AWS_ROLE_ARN: arn:aws:iam::349762920349:role/mmdc-v3-development-github-deploy

jobs:
  quality:
    name: release-quality
    if: github.event_name == 'push' && github.ref_type == 'tag'
    runs-on: ubuntu-24.04
    concurrency:
      group: mmdc-release-quality-${{ github.ref }}
      cancel-in-progress: false
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - run: pnpm run check:policy
      - run: pnpm run format:check
      - run: pnpm run test
      - run: pnpm run typecheck
      - run: env -u PAYLOAD_SECRET -u DATABASE_URL -u DATABASE_DIRECT_URL pnpm run build

  publish:
    name: publish-development-release
    needs: quality
    if: github.event_name == 'push' && github.ref_type == 'tag'
    permissions:
      contents: read
      id-token: write
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: pnpm/action-setup@v4
        with:
          version: 11.20.0
      - uses: actions/setup-node@v4
        with:
          node-version: 24.15.0
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml
      - run: pnpm install --frozen-lockfile
      - name: Validate trusted runner commands
        run: |
          for command in git grep node; do
            command -v "$command" >/dev/null 2>&1
          done
      - name: Validate trusted semantic tag and development ancestry
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          RELEASE_SHA: ${{ github.sha }}
          FORCE_UPDATED: ${{ github.event.forced }}
        run: |
          test "$GITHUB_EVENT_NAME" = push
          test "$GITHUB_REF_TYPE" = tag
          test "$GITHUB_REF" = "refs/tags/$RELEASE_TAG"
          git fetch origin development --force --no-tags
          git merge-base --is-ancestor "$RELEASE_SHA" origin/development
          git tag --points-at "$RELEASE_SHA" | grep -Fx -- "$RELEASE_TAG"
          node --input-type=module -e '
            import { validateReleaseEvent } from "./scripts/release-publication.mjs";
            validateReleaseEvent({
              eventName: process.env.GITHUB_EVENT_NAME,
              refType: process.env.GITHUB_REF_TYPE,
              ref: process.env.GITHUB_REF,
              tag: process.env.RELEASE_TAG,
              environment: "development",
              trusted: true,
              forceUpdated: process.env.FORCE_UPDATED === "true",
              gitSha: process.env.RELEASE_SHA,
              tagCommit: process.env.RELEASE_SHA,
              reachableFromDevelopment: true
            });
          '
      - uses: aws-actions/configure-aws-credentials@v4
        with:
          role-to-assume: ${{ env.AWS_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}
          role-session-name: mmdc-development-release-${{ github.run_id }}
      - uses: docker/setup-buildx-action@v3
      - name: Validate publication runner commands
        run: |
          for command in aws docker git grep node; do
            command -v "$command" >/dev/null 2>&1
          done
      - name: Authenticate to private ECR
        run: aws ecr get-login-password --region "$AWS_REGION" | docker login --username AWS --password-stdin "${ECR_REPOSITORY%%/*}"
      - name: Reject a reused semantic ECR tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          if aws ecr describe-images --repository-name mmdc-v3-development --image-ids imageTag="$RELEASE_TAG" >/dev/null 2>&1; then
            echo 'semantic release tag already exists in immutable ECR; refusing reuse'
            exit 1
          fi
      - name: Build and publish the Git-SHA image once
        env:
          BUILDX_METADATA_FILE: .artifacts/release/build-metadata.json
        run: |
          mkdir -p .artifacts/release
          docker buildx build \
            --file Dockerfile \
            --tag "$ECR_REPOSITORY:$GITHUB_SHA" \
            --sbom=true \
            --provenance=mode=max \
            --metadata-file "$BUILDX_METADATA_FILE" \
            --push .
      - name: Resolve the immutable ECR digest and map the semantic tag
        env:
          RELEASE_TAG: ${{ github.ref_name }}
        run: |
          digest="$(aws ecr describe-images --repository-name mmdc-v3-development --image-ids imageTag="$GITHUB_SHA" --query 'imageDetails[0].imageDigest' --output text)"
          printf '%s\n' "$digest" | grep -E '^sha256:[0-9a-f]{64}$'
          printf '%s\n' "$digest" > .artifacts/release/image.digest
          docker buildx imagetools create --tag "$ECR_REPOSITORY:$RELEASE_TAG" "$ECR_REPOSITORY@$digest"
          DIGEST="$digest" node --input-type=module -e '
            import { writeFileSync } from "node:fs";
            const digest = process.env.DIGEST;
            writeFileSync(".artifacts/release/sbom.json", JSON.stringify({ format: "buildkit-sbom-attestation", subject: `${process.env.ECR_REPOSITORY}@${digest}`, gitSha: process.env.GITHUB_SHA, metadataFile: "build-metadata.json" }, null, 2) + "\n");
            writeFileSync(".artifacts/release/provenance.json", JSON.stringify({ format: "buildkit-provenance-attestation", subject: `${process.env.ECR_REPOSITORY}@${digest}`, gitSha: process.env.GITHUB_SHA, buildMetadata: "build-metadata.json" }, null, 2) + "\n");
          '
      - name: Bind evidence and publish monotonic desired state
        env:
          RELEASE_TAG: ${{ github.ref_name }}
          MIGRATION_VERSION: ${{ vars.MMDC_DEVELOPMENT_MIGRATION_VERSION }}
          WORKFLOW_REF: ${{ github.workflow_ref }}
          RUN_ID: ${{ github.run_id }}
          ACTOR: ${{ github.actor }}
        run: |
          digest="$(cat .artifacts/release/image.digest)"
          test -n "$MIGRATION_VERSION"
          issued_at="$(git show -s --format=%cI "$GITHUB_SHA")"
          printf '%s\n' "$issued_at" | grep -Eq '^20[0-9]{2}-[0-9]{2}-[0-9]{2}T[0-9]{2}:[0-9]{2}:[0-9]{2}(\.[0-9]+)?(Z|[+-][0-9]{2}:[0-9]{2})$'
          node scripts/release-publication.mjs publish-state \
            --repository "$ECR_REPOSITORY" \
            --tag "$RELEASE_TAG" \
            --git-sha "$GITHUB_SHA" \
            --digest "$digest" \
            --migration-version "$MIGRATION_VERSION" \
            --sbom .artifacts/release/sbom.json \
            --provenance .artifacts/release/provenance.json \
            --workflow-ref "$WORKFLOW_REF" \
            --run-id "$RUN_ID" \
            --actor "$ACTOR" \
            --issued-at "$issued_at" \
            --output .artifacts/release/desired.json
          aws s3 cp .artifacts/release/desired.json "s3://$DEPLOYMENT_BUCKET/desired.json" --content-type application/json --sse AES256
      - name: Retain release publication evidence
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: mmdc-development-release-${{ github.run_id }}
          path: .artifacts/release
          retention-days: 14
          if-no-files-found: error
